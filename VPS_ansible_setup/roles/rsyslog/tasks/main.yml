---
- name: Install rsyslog
  dnf:
    name: rsyslog
    state: present

- name: Deploy client config
  template:
    src: client.conf.j2
    dest: /etc/rsyslog.d/client.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart rsyslog

- name: Ensure rsyslog is running and enabled
  systemd:
    name: rsyslog
    state: started
    enabled: yes
